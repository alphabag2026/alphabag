version: '3.8'

services:
  app:
    image: alphabag-v2:latest
    container_name: alphabag-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://alphabag:AlphaBag2024!@alphabag-mysql:3306/alphabag
      JWT_SECRET: ${JWT_SECRET}
      VITE_APP_ID: ${VITE_APP_ID}
      OAUTH_SERVER_URL: ${OAUTH_SERVER_URL}
      VITE_OAUTH_PORTAL_URL: ${VITE_OAUTH_PORTAL_URL}
      OWNER_OPEN_ID: ${OWNER_OPEN_ID}
      OWNER_NAME: ${OWNER_NAME}
      BUILT_IN_FORGE_API_URL: ${BUILT_IN_FORGE_API_URL}
      BUILT_IN_FORGE_API_KEY: ${BUILT_IN_FORGE_API_KEY}
      VITE_FRONTEND_FORGE_API_KEY: ${VITE_FRONTEND_FORGE_API_KEY}
      VITE_FRONTEND_FORGE_API_URL: ${VITE_FRONTEND_FORGE_API_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TWITTER_BEARER_TOKEN: ${TWITTER_BEARER_TOKEN}
    depends_on:
      - mysql
    networks:
      - alphabag-net

  mysql:
    image: mysql:8.0
    container_name: alphabag-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: AlphaBag2024!
      MYSQL_DATABASE: alphabag
      MYSQL_USER: alphabag
      MYSQL_PASSWORD: AlphaBag2024!
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - alphabag-net
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  nginx:
    image: nginx:alpine
    container_name: alphabag-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - alphabag-net

volumes:
  mysql-data:

networks:
  alphabag-net:
    driver: bridge
